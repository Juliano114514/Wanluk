name: Publish release APK

on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect version change
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def version(text):
              name = re.search(r'^\s*versionName\s*=\s*"([^"\r\n]+)"\s*$', text, re.M)
              code = re.search(r'^\s*versionCode\s*=\s*(\d+)\s*$', text, re.M)
              if not name or not code:
                  raise SystemExit('Expected literal versionName and versionCode in app/build.gradle.kts')
              return name.group(1), code.group(1)

          current = version(Path('app/build.gradle.kts').read_text())
          if not re.fullmatch(r'\d+\.\d+\.\d+', current[0]):
              raise SystemExit('Current versionName must have three numeric components')
          changed = True
          before = os.environ.get('BEFORE_SHA', '')
          if os.environ['EVENT_NAME'] == 'push' and before and set(before) != {'0'}:
              previous = subprocess.run(
                  ['git', 'show', f'{before}:app/build.gradle.kts'],
                  check=True, capture_output=True, text=True
              ).stdout
              changed = current != version(previous)
          name, code = current
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\nname={name}\ncode={code}\ntag=v{name}-code{code}\n')
          print(f'Version: {name} ({code}); build: {changed}')
          PY

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Restore keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Missing ANDROID_KEYSTORE_BASE64 secret.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanluk-release.jks"
          test -s "$RUNNER_TEMP/wanluk-release.jks"

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wanluk-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing $secret_name secret." >&2
              exit 1
            fi
          done
          bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        shell: bash
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Wanluk-${VERSION_NAME}-${VERSION_CODE}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Wanluk-${{ needs.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its assets unchanged."
            exit 0
          fi
          printf 'Signed release APK for Wanluk %s (versionCode %s).\n\nSource commit: %s\n\nBuild and APK signature verification passed. Device behavior has not been verified by this workflow.\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Wanluk $VERSION_NAME ($VERSION_CODE)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wanluk-release.jks"
